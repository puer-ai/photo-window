name: Bug report
description: Report a reproducible problem with the skill or helper scripts.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not upload private photographs, credentials, personal information, or unlicensed assets.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Describe the prompt, image type, selected core, coverage plan, and steps to reproduce.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, agent environment, and image-editing tool.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Use synthetic or properly licensed examples only.
