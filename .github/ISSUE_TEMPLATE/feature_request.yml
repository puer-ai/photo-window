name: Feature request
description: Suggest a focused improvement to the skill.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What user request or image-editing situation should this support?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired workflow and completion criteria.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Fidelity and coverage tradeoffs
      description: Explain how the proposal affects subject preservation, coverage, or exact-size output.
